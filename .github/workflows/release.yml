name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run acceptance
      - run: npm run release:assets
      - name: Choose release channel
        id: channel
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          GATE=$(node -e "const a=require('./artifacts/acceptance-${VERSION}.json'); process.stdout.write(a.releaseGate)")
          echo "gate=$GATE" >> "$GITHUB_OUTPUT"
          if [ "$GATE" = "ready" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release create "${RELEASE_TAG}" \
            "artifacts/petite-grace.user.js" \
            "artifacts/petite-grace.meta.js" \
            "artifacts/petite-grace-v${VERSION}-source.zip" \
            artifacts/SHA256SUMS.txt \
            "artifacts/acceptance-${VERSION}.json" \
            --title "Petite Grace ${RELEASE_TAG}" \
            --notes-file "docs/releases/${RELEASE_TAG}.md" \
            ${{ steps.channel.outputs.flag }}
